# ─────────────────────────────────────────────────────────────
#  Cube Analytique — Spark SQL + Trino (stockage local)
# ─────────────────────────────────────────────────────────────

networks:
  cube-net:
    driver: bridge

volumes:
  postgres-data:
  warehouse:       # Stockage Parquet local (remplace MinIO)

services:

  # ── PostgreSQL (backend du Hive Metastore) ───────────────
  postgres:
    image: postgres:15-alpine
    container_name: hive-postgres
    networks: [cube-net]
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive123
      POSTGRES_HOST_AUTH_METHOD: "trust"
    command: ["postgres", "-c", "password_encryption=md5"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Hive Metastore ───────────────────────────────────────
  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    networks: [cube-net]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9083:9083"
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive123
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        export HADOOP_CLIENT_OPTS="$$HADOOP_CLIENT_OPTS -Xmx1G $$SERVICE_OPTS"
        /opt/hive/bin/schematool -dbType postgres -info || /opt/hive/bin/schematool -dbType postgres -initSchema
        exec /opt/hive/bin/hive --skiphadoopversion --skiphbasecp --service metastore
    volumes:
      - ./hive/hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./hive/postgresql-42.6.0.jar:/opt/hive/lib/postgresql-9.4.1208.jre7.jar
      - warehouse:/opt/warehouse
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9083"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Spark Master ─────────────────────────────────────────
  spark-master:
    image: bitnamilegacy/spark:3.5
    container_name: spark-master
    user: root
    networks: [cube-net]
    depends_on:
      hive-metastore:
        condition: service_healthy
    ports:
      - "8080:8080"   # Spark Master UI
      - "7077:7077"   # Spark Master port
      - "4040:4040"   # Spark App UI
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    volumes:
      - ./spark/jobs:/opt/spark-jobs
      - ./spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
      - ./hive/hive-site.xml:/opt/bitnami/spark/conf/hive-site.xml
      - ./data:/opt/raw-data           # Données brutes CSV
      - warehouse:/opt/warehouse       # Parquet partagé

  # ── Spark Worker ─────────────────────────────────────────
  spark-worker:
    image: bitnamilegacy/spark:3.5
    container_name: spark-worker
    user: root
    networks: [cube-net]
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    volumes:
      - ./spark/jobs:/opt/spark-jobs
      - ./spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
      - ./hive/hive-site.xml:/opt/bitnami/spark/conf/hive-site.xml
      - ./data:/opt/raw-data
      - warehouse:/opt/warehouse

  # ── Trino ────────────────────────────────────────────────
  trino:
    image: trinodb/trino:426
    container_name: trino
    networks: [cube-net]
    depends_on:
      hive-metastore:
        condition: service_healthy
    ports:
      - "8085:8080"   # Trino Web UI
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      - ./trino/config.properties:/etc/trino/config.properties
      - ./trino/jvm.config:/etc/trino/jvm.config
      - warehouse:/opt/warehouse       # Accès direct aux Parquet

  # ── Dashboard (serveur web léger) ────────────────────────
  dashboard:
    image: nginx:alpine
    container_name: dashboard
    networks: [cube-net]
    ports:
      - "8088:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
